name: Website feed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_feed.py
      - run: |
          git config user.name "sam-package-bot"
          git config user.email "sam-package-bot@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || (git commit -m "Website feed $(date -u +%Y-%m-%d)" && git push)
