name: Daily SAM.gov packages

on:
  schedule:
    - cron: "17 11 * * *"   # every day, about 5:17 AM Chicago time
  workflow_dispatch:         # lets you run it by hand from the Actions tab
    inputs:
      recent_days:
        description: "Look back this many days (use 60 to catch up on everything open)"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download new solicitation packages
        env:
          RECENT_DAYS: ${{ github.event.inputs.recent_days }}
        run: python fetch_sam_packages.py
      - name: Build website feed
        run: python build_feed.py || echo "feed build failed"
      - name: Save packages to the repo
        run: |
          git config user.name "sam-package-bot"
          git config user.email "sam-package-bot@users.noreply.github.com"
          mkdir -p sources-sought && git add -A packages sources-sought && (git add feed.json || true)
          if git diff --cached --quiet; then
            echo "No new packages today."
          else
            git commit -m "New SAM.gov packages $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Build past awards and recompetes
        timeout-minutes: 20
        continue-on-error: true
        run: python build_awards.py || echo "awards build failed"
      - name: Save awards to the repo
        if: always()
        run: |
          git add awards.json || true
          if git diff --cached --quiet; then
            echo "No awards changes."
          else
            git commit -m "Awards update $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          fi
