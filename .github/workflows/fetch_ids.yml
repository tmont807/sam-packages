name: Fetch specific notices
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "SAM notice IDs separated by ,"
        required: true
      out:
        description: "Folder to save into"
        required: false
        default: "anala"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          IDS: ${{ github.event.inputs.ids }}
          OUT: ${{ github.event.inputs.out }}
        run: python fetch_ids.py
      - run: |
          git config user.name "sam-package-bot"
          git config user.email "sam-package-bot@users.noreply.github.com"
          git add -A "${{ github.event.inputs.out }}"
          git diff --cached --quiet || (git commit -m "Fetched notices" && git push)
