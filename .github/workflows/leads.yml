name: Commercial leads

on:
  schedule:
    - cron: "43 9 * * 1"   # Mondays: refresh the 6 cities updated longest ago
  workflow_dispatch:
    inputs:
      cities:
        description: 'City name (e.g. "Kansas City"), "all", or "rotate"'
        required: false
        default: "rotate"
      types:
        description: "Buyer types, comma separated (blank = all)"
        required: false
        default: ""
      enrich:
        description: "Websites to check for an email, per city"
        required: false
        default: "150"

permissions:
  contents: write

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build prospect lists
        env:
          CITIES: ${{ github.event.inputs.cities || 'rotate' }}
          TYPES: ${{ github.event.inputs.types }}
          ENRICH: ${{ github.event.inputs.enrich || '150' }}
        run: |
          args=("$CITIES")
          [ "$CITIES" = "rotate" ] && args+=(6)
          [ -n "$TYPES" ] && args+=(--types "$TYPES")
          python leads/prospects.py "${args[@]}" --enrich "$ENRICH"
      - name: Save lists
        if: always()
        run: |
          git config user.name "sam-package-bot"
          git config user.email "sam-package-bot@users.noreply.github.com"
          git add leads/data
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Commercial leads $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          fi
